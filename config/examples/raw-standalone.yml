apiVersion: observeweaver.io/v1alpha1
kind: ObserveWeaver

metadata:
  name: observeweaver-native
  environment: production

deployment:
  engine: raw
  mode: standalone
  namespace: observeweaver

platform:
  family: linux
  distribution: ubuntu
  version: "24.04"
  execution: native

nodes:
  - name: obs-01
    address: 192.0.2.11
    roles: [metrics, telemetry, logs, data, ingress]

network:
  domain: observability.example.com
  bindAddress: 0.0.0.0
  vip: null
  ingress:
    enabled: true
    className: external
  ports:
    prometheus: 9090
    alertmanager: 9093
    alertmanagerCluster: 9094
    grafana: 3000
    otlpGrpc: 4317
    otlpHttp: 4318
    otelHealth: 13133
    otelMetrics: 8888
    otelPrometheus: 8889
    zabbixServer: 10051
    zabbixWeb: 8080
    graylogHttp: 9000
    graylogDataNode: 8999
    graylogBeats: 5044
    graylogGelfTcp: 12201
    graylogGelfUdp: 12201
    graylogSyslogTcp: 1514
    graylogSyslogUdp: 1514
    opensearch: 9200
    opensearchTransport: 9300
    mongodb: 27017

tls:
  mode: provided
  provided:
    certificateFile: /etc/observeweaver/tls/fullchain.pem
    privateKeyFile: /etc/observeweaver/tls/private.key
  certManager:
    clusterIssuer: null

storage:
  className: native-local
  shared: false
  sizes:
    prometheus: 100Gi
    alertmanager: 5Gi
    grafana: 10Gi
    graylogJournal: 50Gi
    opensearch: 300Gi
    mongodb: 30Gi
    postgresql: 20Gi
    zabbixPostgresql: 20Gi

retention:
  metricsDays: 30
  logsDays: 30

security:
  allowPlaintext: false
  secretFile: secrets/observeweaver.env
  kubernetesSecretName: observeweaver-secrets

components:
  prometheus:
    enabled: true
    version: "3.13.1"
    replicas: 1
  alertmanager:
    enabled: true
    version: "0.33.1"
    replicas: 1
  grafana:
    enabled: true
    version: "13.1.1"
    replicas: 1
  opentelemetry:
    enabled: true
    version: "0.157.0"
    replicas: 1
  zabbix:
    enabled: true
    version: "7.0.28"
    replicas: 1
  graylog:
    enabled: true
    version: "7.1.6"
    replicas: 1
  opensearch:
    enabled: true
    version: "2.19.5"
    replicas: 1
    javaOpts: -Xms2g -Xmx2g

dependencies:
  mongodb:
    version: "8.0.28"
    external: false
  postgresql:
    version: "17"
    external: false
  zabbixPostgresql:
    version: "17"
    external: true
