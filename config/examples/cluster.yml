apiVersion: observeweaver.io/v1alpha1
kind: ObserveWeaver

metadata:
  name: observeweaver-ha
  environment: production

deployment:
  engine: rke2
  mode: cluster
  namespace: observeweaver
  kubernetesVersion: "1.33"
  # The official Graylog 1.0.0 chart is beta; this is an explicit acknowledgement.
  acceptBetaGraylogChart: true

platform:
  family: linux
  distribution: rocky
  version: "9"
  execution: native

nodes:
  - name: obs-01
    address: 192.0.2.11
    roles: [control, metrics, telemetry, logs, data, ingress]
  - name: obs-02
    address: 192.0.2.12
    roles: [control, metrics, telemetry, logs, data, ingress]
  - name: obs-03
    address: 192.0.2.13
    roles: [control, metrics, telemetry, logs, data, ingress]

network:
  domain: observability.example.com
  bindAddress: 0.0.0.0
  vip: 192.0.2.10
  ingress:
    enabled: true
    className: nginx
  ports:
    prometheus: 9090
    alertmanager: 9093
    alertmanagerCluster: 9094
    grafana: 3000
    otlpGrpc: 4317
    otlpHttp: 4318
    otelHealth: 13133
    otelMetrics: 8888
    otelPrometheus: 8889
    zabbixServer: 10051
    zabbixWeb: 8080
    graylogHttp: 9000
    graylogDataNode: 8999
    graylogBeats: 5044
    graylogGelfTcp: 12201
    graylogGelfUdp: 12201
    graylogSyslogTcp: 1514
    graylogSyslogUdp: 1514
    opensearch: 9200
    opensearchTransport: 9300
    elasticsearch: 9201
    elasticsearchTransport: 9301
    kibana: 5601
    logstashBeats: 5045
    logstashApi: 9600
    mongodb: 27017
    redis: 6379
    redisSentinel: 26379
    kafka: 9092
    kafkaController: 9095

tls:
  mode: cert-manager
  secretName: observeweaver-public-tls
  additionalDnsNames: []
  additionalIpAddresses: []
  provided:
    certificateFile: null
    privateKeyFile: null
  certManager:
    clusterIssuer: letsencrypt-production

storage:
  className: longhorn
  shared: true
  sizes:
    prometheus: 250Gi
    alertmanager: 10Gi
    grafana: 20Gi
    graylogJournal: 100Gi
    opensearch: 1Ti
    elasticsearch: 1Ti
    logstash: 20Gi
    mongodb: 50Gi
    postgresql: 50Gi
    zabbixPostgresql: 50Gi
    redis: 50Gi
    kafka: 500Gi

retention:
  metricsDays: 30
  logsDays: 90

security:
  allowPlaintext: false
  secretFile: secrets/observeweaver.env
  kubernetesSecretName: observeweaver-secrets

components:
  prometheus:
    enabled: true
    version: "3.13.1"
    replicas: 2
  alertmanager:
    enabled: true
    version: "0.33.1"
    replicas: 3
  grafana:
    enabled: true
    version: "13.1.1"
    replicas: 2
  opentelemetry:
    enabled: true
    version: "0.157.0"
    replicas: 3
  zabbix:
    enabled: true
    version: "7.0.28"
    replicas: 3
  graylog:
    enabled: true
    version: "7.1.6"
    replicas: 2
  opensearch:
    enabled: true
    version: "2.19.5"
    replicas: 3
    javaOpts: -Xms8g -Xmx8g
  elasticsearch:
    enabled: true
    version: "9.4.2"
    replicas: 3
  kibana:
    enabled: true
    version: "9.4.2"
    replicas: 2
  logstash:
    enabled: true
    version: "9.4.2"
    replicas: 2
  redis:
    enabled: true
    version: "8.8.0"
    replicas: 3
  kafka:
    enabled: true
    distribution: apache
    version: "4.3.1"
    replicas: 3

dependencies:
  mongodb:
    version: "8.0.28"
    external: false
  postgresql:
    version: "17"
    external: true
  zabbixPostgresql:
    version: "17"
    external: true
