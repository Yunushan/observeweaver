apiVersion: observeweaver.io/v1alpha1
kind: ObserveWeaver

metadata:
  name: observeweaver-k3s
  environment: production

deployment:
  engine: k3s
  mode: standalone
  namespace: observeweaver
  kubernetesVersion: "1.33"
  acceptBetaGraylogChart: true

platform:
  family: linux
  distribution: ubuntu
  version: "24.04"
  execution: native

nodes:
  - name: obs-01
    address: 192.0.2.11
    roles: [control, metrics, telemetry, logs, data, ingress]

network:
  domain: observability.example.com
  bindAddress: 0.0.0.0
  vip: 192.0.2.10
  ingress:
    enabled: true
    className: traefik
  ports:
    prometheus: 9090
    alertmanager: 9093
    alertmanagerCluster: 9094
    grafana: 3000
    otlpGrpc: 4317
    otlpHttp: 4318
    otelHealth: 13133
    otelMetrics: 8888
    otelPrometheus: 8889
    zabbixServer: 10051
    zabbixWeb: 8080
    graylogHttp: 9000
    graylogDataNode: 8999
    graylogBeats: 5044
    graylogGelfTcp: 12201
    graylogGelfUdp: 12201
    graylogSyslogTcp: 1514
    graylogSyslogUdp: 1514
    opensearch: 9200
    elasticsearch: 9201
    elasticsearchTransport: 9301
    kibana: 5601
    logstashBeats: 5045
    logstashApi: 9600
    opensearchTransport: 9300
    mongodb: 27017
    redis: 6379
    redisSentinel: 26379
    kafka: 9092
    kafkaController: 9095

tls:
  mode: cert-manager
  secretName: observeweaver-public-tls
  additionalDnsNames: []
  additionalIpAddresses: []
  provided:
    certificateFile: null
    privateKeyFile: null
  certManager:
    clusterIssuer: letsencrypt-production

storage:
  className: local-path
  shared: false
  sizes:
    prometheus: 100Gi
    alertmanager: 5Gi
    grafana: 10Gi
    graylogJournal: 50Gi
    opensearch: 300Gi
    elasticsearch: 300Gi
    logstash: 20Gi
    mongodb: 30Gi
    postgresql: 20Gi
    zabbixPostgresql: 20Gi
    redis: 20Gi
    kafka: 100Gi

retention:
  metricsDays: 30
  logsDays: 30

security:
  allowPlaintext: false
  secretFile: secrets/observeweaver.env
  kubernetesSecretName: observeweaver-secrets

components:
  prometheus:
    enabled: true
    version: "3.13.1"
    replicas: 1
  alertmanager:
    enabled: true
    version: "0.33.1"
    replicas: 1
  grafana:
    enabled: true
    version: "13.1.1"
    replicas: 1
  opentelemetry:
    enabled: true
    version: "0.157.0"
    replicas: 1
  zabbix:
    enabled: true
    version: "7.0.28"
    replicas: 1
  graylog:
    enabled: true
    version: "7.1.6"
    replicas: 1
  opensearch:
    enabled: true
    version: "2.19.5"
    replicas: 1
    javaOpts: -Xms2g -Xmx2g
  elasticsearch:
    enabled: true
    version: "9.4.2"
    replicas: 1
  kibana:
    enabled: true
    version: "9.4.2"
    replicas: 1
  logstash:
    enabled: true
    version: "9.4.2"
    replicas: 1
  redis:
    enabled: true
    version: "8.8.0"
    replicas: 1
  kafka:
    enabled: true
    distribution: apache
    version: "4.3.1"
    replicas: 1

dependencies:
  mongodb:
    version: "8.0.28"
    external: false
  postgresql:
    version: "17"
    external: false
  zabbixPostgresql:
    version: "17"
    external: false
