name: observeweaver-cluster

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:?required}
    <<: *restart
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.listen-address=${NODE_ENDPOINT_ADDRESS:?required}:${PROMETHEUS_PORT:-9090}
    volumes:
      - "${NODE_CONFIG_DIR:?required}/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - prometheus-data:/prometheus
    security_opt: [no-new-privileges:true]
    logging: *logging
    profiles: [prometheus]

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:?required}
    <<: *restart
    network_mode: host
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -- /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager \
          --web.listen-address=${NODE_ENDPOINT_ADDRESS}:${ALERTMANAGER_PORT:-9093} \
          --cluster.listen-address=${NODE_ENDPOINT_ADDRESS}:${ALERTMANAGER_CLUSTER_PORT:-9094}
        old_ifs="$$IFS"
        IFS=","
        for peer in ${ALERTMANAGER_PEERS:-}; do
          if [ -n "$$peer" ]; then
            set -- "$$@" "--cluster.peer=$$peer"
          fi
        done
        IFS="$$old_ifs"
        exec "$$@"
    volumes:
      - "${NODE_CONFIG_DIR:?required}/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"
      - alertmanager-data:/alertmanager
    security_opt: [no-new-privileges:true]
    logging: *logging
    profiles: [alertmanager]

  grafana:
    image: ${GRAFANA_IMAGE:?required}
    <<: *restart
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: ${NODE_ADDRESS:?required}
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3000}
      GF_SERVER_DOMAIN: grafana.${OBSERVEWEAVER_DOMAIN:?required}
      GF_SERVER_ROOT_URL: ${OBSERVEWEAVER_SCHEME:-https}://grafana.${OBSERVEWEAVER_DOMAIN}/
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: ${GRAFANA_DATABASE_HOST:?required}
      GF_DATABASE_NAME: ${GRAFANA_DATABASE_NAME:-grafana}
      GF_DATABASE_USER: ${GRAFANA_DATABASE_USER:-grafana}
      GF_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      GF_DATABASE_SSL_MODE: require
    volumes:
      - grafana-data:/var/lib/grafana
      - "${NODE_CONFIG_DIR:?required}/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro"
    security_opt: [no-new-privileges:true]
    logging: *logging
    profiles: [grafana]

  otel-collector:
    image: ${OTELCOL_IMAGE:?required}
    <<: *restart
    network_mode: host
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - "${NODE_CONFIG_DIR:?required}/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro"
    security_opt: [no-new-privileges:true]
    logging: *logging
    profiles: [opentelemetry]

  zabbix-postgresql:
    image: ${POSTGRES_IMAGE:?required}
    <<: *restart
    network_mode: host
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: ${ZABBIX_DATABASE_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DATABASE_PASSWORD:?required}
    volumes:
      - zabbix-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    logging: *logging
    profiles: [zabbix-postgresql]

  zabbix-server:
    image: ${ZABBIX_SERVER_IMAGE:?required}
    <<: *restart
    network_mode: host
    environment:
      DB_SERVER_HOST: ${ZABBIX_DATABASE_HOST:?required}
      DB_SERVER_PORT: ${ZABBIX_DATABASE_PORT:-5432}
      POSTGRES_USER: ${ZABBIX_DATABASE_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DATABASE_PASSWORD:?required}
      POSTGRES_DB: ${ZABBIX_DATABASE_NAME:-zabbix}
      ZBX_LISTENPORT: ${ZABBIX_SERVER_PORT:-10051}
      ZBX_HANODENAME: ${NODE_NAME:?required}
      ZBX_NODEADDRESS: ${NODE_ADDRESS:?required}:${ZABBIX_SERVER_PORT:-10051}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "nc -z 127.0.0.1 ${ZABBIX_SERVER_PORT:-10051} || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    security_opt: [no-new-privileges:true]
    logging: *logging
    profiles: [zabbix]

  zabbix-web:
    image: ${ZABBIX_WEB_IMAGE:?required}
    <<: *restart
    network_mode: host
    environment:
      DB_SERVER_HOST: ${ZABBIX_DATABASE_HOST:?required}
      DB_SERVER_PORT: ${ZABBIX_DATABASE_PORT:-5432}
      POSTGRES_USER: ${ZABBIX_DATABASE_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DATABASE_PASSWORD:?required}
      POSTGRES_DB: ${ZABBIX_DATABASE_NAME:-zabbix}
      PHP_TZ: UTC
    security_opt: [no-new-privileges:true]
    logging: *logging
    profiles: [zabbix]

  redis:
    image: ${REDIS_IMAGE:?required}
    <<: *restart
    network_mode: host
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -eu
        if [ "${NODE_NAME:?required}" = "$${REDIS_PRIMARY_NODE:?required}" ]; then
          exec redis-server --bind 127.0.0.1,${NODE_ADDRESS:?required} --port "$${REDIS_PORT:-6379}" --appendonly yes --appendfsync everysec --protected-mode yes --requirepass "$${REDIS_PASSWORD:?required}"
        fi
        exec redis-server --bind 127.0.0.1,${NODE_ADDRESS:?required} \
          --port "$${REDIS_PORT:-6379}" --appendonly yes --appendfsync everysec \
          --protected-mode yes --requirepass "$${REDIS_PASSWORD:?required}" \
          --masterauth "$${REDIS_PASSWORD}" \
          --replicaof "$${REDIS_PRIMARY_HOST:?required}" "$${REDIS_PORT:-6379}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping)\" = PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt: [no-new-privileges:true]
    logging: *logging
    profiles: [redis]

  redis-sentinel:
    image: ${REDIS_IMAGE:?required}
    <<: *restart
    network_mode: host
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -eu
        cat >/tmp/observeweaver-sentinel.conf <<EOF
        port $${REDIS_SENTINEL_PORT:-26379}
        bind 127.0.0.1,${NODE_ADDRESS:?required}
        protected-mode yes
        sentinel monitor observeweaver $${REDIS_PRIMARY_HOST:?required} $${REDIS_PORT:-6379} $${REDIS_SENTINEL_QUORUM:-2}
        sentinel auth-pass observeweaver $${REDIS_PASSWORD:?required}
        sentinel down-after-milliseconds observeweaver 5000
        sentinel failover-timeout observeweaver 60000
        sentinel parallel-syncs observeweaver 1
        EOF
        exec redis-server /tmp/observeweaver-sentinel.conf --sentinel
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    depends_on:
      redis:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    logging: *logging
    profiles: [redis]

  kafka:
    image: ${KAFKA_IMAGE:?required}
    hostname: ${NODE_NAME:?required}
    <<: *restart
    network_mode: host
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?required}
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:?required}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:${KAFKA_PORT:-9092},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-9095}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${NODE_ADDRESS:?required}:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:?required}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_MIN_ISR:-2}
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: ${KAFKA_MIN_ISR:-2}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if command -v kafka-broker-api-versions >/dev/null 2>&1; then
          kafka-broker-api-versions --bootstrap-server 127.0.0.1:${KAFKA_PORT:-9092};
          elif command -v kafka-broker-api-versions.sh >/dev/null 2>&1; then
          kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:${KAFKA_PORT:-9092};
          elif [ -x /opt/kafka/bin/kafka-broker-api-versions.sh ]; then
          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server
          127.0.0.1:${KAFKA_PORT:-9092}; else exit 1; fi >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    security_opt: [no-new-privileges:true]
    logging: *logging
    profiles: [kafka]

  mongodb:
    image: ${MONGODB_IMAGE:?required}
    <<: *restart
    network_mode: host
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        umask 077
        printf '%s' "$${MONGODB_REPLICA_SET_KEY}" >/tmp/observeweaver-keyfile
        chown mongodb:mongodb /tmp/observeweaver-keyfile
        exec docker-entrypoint.sh mongod \
          --bind_ip 127.0.0.1,${NODE_ADDRESS} \
          --port ${MONGODB_PORT:-27017} \
          --replSet observeweaver \
          --keyFile /tmp/observeweaver-keyfile
    environment:
      MONGODB_REPLICA_SET_KEY: ${MONGODB_REPLICA_SET_KEY:?required}
    volumes:
      - mongodb-data:/data/db
    security_opt: [no-new-privileges:true]
    logging: *logging
    profiles: [mongodb]

  opensearch:
    image: ${OPENSEARCH_IMAGE:?required}
    <<: *restart
    network_mode: host
    environment:
      cluster.name: observeweaver
      node.name: ${NODE_NAME:?required}
      network.host: ${NODE_ADDRESS:?required}
      http.port: ${OPENSEARCH_PORT:-9200}
      transport.port: ${OPENSEARCH_TRANSPORT_PORT:-9300}
      discovery.seed_hosts: ${OPENSEARCH_SEED_HOSTS:?required}
      cluster.initial_cluster_manager_nodes: ${OPENSEARCH_INITIAL_CLUSTER_MANAGER_NODES:?required}
      node.roles: cluster_manager,data,ingest,remote_cluster_client
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms8g -Xmx8g}
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    logging: *logging
    profiles: [opensearch]

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:?required}
    <<: *restart
    network_mode: host
    environment:
      cluster.name: observeweaver-elastic
      node.name: ${NODE_NAME:?required}
      network.host: ${NODE_ADDRESS:?required}
      http.port: ${ELASTICSEARCH_PORT:-9201}
      transport.port: ${ELASTICSEARCH_TRANSPORT_PORT:-9301}
      discovery.seed_hosts: ${ELASTICSEARCH_SEED_HOSTS:?required}
      cluster.initial_master_nodes: ${ELASTICSEARCH_INITIAL_MASTER_NODES:?required}
      node.roles: master,data,ingest,remote_cluster_client
      bootstrap.memory_lock: "true"
      xpack.security.enabled: ${ELASTICSEARCH_SECURITY_ENABLED:-false}
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?required}
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    security_opt: [no-new-privileges:true]
    logging: *logging
    profiles: [elasticsearch]

  kibana:
    image: ${KIBANA_IMAGE:?required}
    <<: *restart
    network_mode: host
    environment:
      SERVER_NAME: ${NODE_NAME:?required}
      SERVER_HOST: ${NODE_ADDRESS:?required}
      SERVER_PORT: ${KIBANA_PORT:-5601}
      SERVER_PUBLICBASEURL: ${OBSERVEWEAVER_SCHEME:-https}://kibana.${OBSERVEWEAVER_DOMAIN:?required}/
      ELASTICSEARCH_HOSTS: ${ELASTICSEARCH_HOSTS:?required}
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?required}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_ENCRYPTION_KEY:?required}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?required}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_ENCRYPTION_KEY:?required}
    volumes:
      - kibana-data:/usr/share/kibana/data
    security_opt: [no-new-privileges:true]
    logging: *logging
    profiles: [kibana]

  logstash:
    image: ${LOGSTASH_IMAGE:?required}
    <<: *restart
    network_mode: host
    environment:
      LS_JAVA_OPTS: ${LOGSTASH_JAVA_OPTS:--Xms1g -Xmx1g}
      QUEUE_TYPE: persisted
      ELASTICSEARCH_HOSTS: ${ELASTICSEARCH_HOSTS:?required}
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?required}
      LOGSTASH_WRITER_PASSWORD: ${LOGSTASH_WRITER_PASSWORD:?required}
    volumes:
      - "${NODE_CONFIG_DIR:?required}/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro"
      - logstash-data:/usr/share/logstash/data
    security_opt: [no-new-privileges:true]
    logging: *logging
    profiles: [logstash]

  graylog:
    image: ${GRAYLOG_IMAGE:?required}
    <<: *restart
    network_mode: host
    environment:
      GRAYLOG_LEADER_ELECTION_MODE: automatic
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET:?required}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2:?required}
      GRAYLOG_HTTP_BIND_ADDRESS: ${NODE_ENDPOINT_ADDRESS:?required}:${GRAYLOG_HTTP_PORT:-9000}
      GRAYLOG_HTTP_PUBLISH_URI: http://${NODE_ENDPOINT_ADDRESS}:${GRAYLOG_HTTP_PORT:-9000}/
      GRAYLOG_HTTP_EXTERNAL_URI: ${OBSERVEWEAVER_SCHEME:-https}://graylog.${OBSERVEWEAVER_DOMAIN:?required}/
      GRAYLOG_MESSAGE_JOURNAL_MAX_AGE: ${GRAYLOG_RETENTION_DAYS:-90}d
      GRAYLOG_ELASTICSEARCH_REPLICAS: ${GRAYLOG_ELASTICSEARCH_REPLICAS:-1}
      GRAYLOG_ROTATION_STRATEGY: time
      GRAYLOG_ELASTICSEARCH_MAX_TIME_PER_INDEX: 1d
      GRAYLOG_RETENTION_STRATEGY: delete
      GRAYLOG_ELASTICSEARCH_MAX_NUMBER_OF_INDICES: ${GRAYLOG_RETENTION_DAYS:-90}
    volumes:
      - graylog-journal:/usr/share/graylog/data/journal
    security_opt: [no-new-privileges:true]
    logging: *logging
    profiles: [graylog]

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  mongodb-data:
  opensearch-data:
  elasticsearch-data:
  kibana-data:
  logstash-data:
  graylog-journal:
  zabbix-postgresql-data:
  redis-data:
  kafka-data:
