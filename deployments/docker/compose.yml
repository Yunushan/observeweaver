name: observeweaver

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-restart: &default-restart
  restart: unless-stopped

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:?PROMETHEUS_IMAGE is required}
    profiles: [prometheus]
    <<: *default-restart
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
      - --web.listen-address=0.0.0.0:${PROMETHEUS_PORT:-9090}
    volumes:
      - "${DOCKER_CONFIG_DIR:?DOCKER_CONFIG_DIR is required}/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "${DOCKER_CONFIG_DIR:?DOCKER_CONFIG_DIR is required}/prometheus-rules.yml:/etc/prometheus/rules.yml:ro"
      - prometheus-data:/prometheus
    ports:
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:${PROMETHEUS_PORT:-9090}"
    networks:
      - frontend
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:${PROMETHEUS_PORT:-9090}/-/healthy",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:?ALERTMANAGER_IMAGE is required}
    profiles: [alertmanager]
    <<: *default-restart
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:${ALERTMANAGER_PORT:-9093}
    volumes:
      - "${DOCKER_CONFIG_DIR:?DOCKER_CONFIG_DIR is required}/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"
      - alertmanager-data:/alertmanager
    ports:
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:${ALERTMANAGER_PORT:-9093}"
    networks:
      - frontend
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:${ALERTMANAGER_PORT:-9093}/-/healthy",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  grafana:
    image: ${GRAFANA_IMAGE:?GRAFANA_IMAGE is required}
    profiles: [grafana]
    <<: *default-restart
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${OBSERVEWEAVER_DOMAIN:?OBSERVEWEAVER_DOMAIN is required}
      GF_SERVER_ROOT_URL: ${OBSERVEWEAVER_SCHEME:-https}://grafana.${OBSERVEWEAVER_DOMAIN}/
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3000}
      GF_DATABASE_TYPE: ${GRAFANA_DATABASE_TYPE:-sqlite3}
      GF_DATABASE_HOST: ${GRAFANA_DATABASE_HOST:-}
      GF_DATABASE_NAME: ${GRAFANA_DATABASE_NAME:-grafana}
      GF_DATABASE_USER: ${GRAFANA_DATABASE_USER:-grafana}
      GF_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-}
      GF_METRICS_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - "${DOCKER_CONFIG_DIR:?DOCKER_CONFIG_DIR is required}/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro"
    ports:
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:${GRAFANA_PORT:-3000}"
    networks:
      - frontend
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:$${GF_SERVER_HTTP_PORT:-3000}/api/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  otel-collector:
    image: ${OTELCOL_IMAGE:?OTELCOL_IMAGE is required}
    profiles: [opentelemetry]
    <<: *default-restart
    command:
      - --config=/etc/otelcol-contrib/config.yml
    volumes:
      - "${DOCKER_CONFIG_DIR:?DOCKER_CONFIG_DIR is required}/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro"
    ports:
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${OTLP_GRPC_PORT:-4317}:${OTLP_GRPC_PORT:-4317}"
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${OTLP_HTTP_PORT:-4318}:${OTLP_HTTP_PORT:-4318}"
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${OTEL_HEALTH_PORT:-13133}:${OTEL_HEALTH_PORT:-13133}"
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  zabbix-postgresql:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    profiles: [zabbix]
    <<: *default-restart
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: ${ZABBIX_DATABASE_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DATABASE_PASSWORD:?ZABBIX_DATABASE_PASSWORD is required}
    volumes:
      - zabbix-postgresql-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  zabbix-server:
    image: ${ZABBIX_SERVER_IMAGE:?ZABBIX_SERVER_IMAGE is required}
    profiles: [zabbix]
    <<: *default-restart
    environment:
      DB_SERVER_HOST: zabbix-postgresql
      DB_SERVER_PORT: ${ZABBIX_DATABASE_PORT:-5432}
      POSTGRES_USER: ${ZABBIX_DATABASE_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DATABASE_PASSWORD:?ZABBIX_DATABASE_PASSWORD is required}
      POSTGRES_DB: ${ZABBIX_DATABASE_NAME:-zabbix}
      ZBX_LISTENPORT: ${ZABBIX_SERVER_PORT:-10051}
    ports:
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${ZABBIX_SERVER_PORT:-10051}:${ZABBIX_SERVER_PORT:-10051}"
    networks:
      - frontend
      - backend
    depends_on:
      zabbix-postgresql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "nc -z 127.0.0.1 ${ZABBIX_SERVER_PORT:-10051} || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  zabbix-web:
    image: ${ZABBIX_WEB_IMAGE:?ZABBIX_WEB_IMAGE is required}
    profiles: [zabbix]
    <<: *default-restart
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: ${ZABBIX_SERVER_PORT:-10051}
      DB_SERVER_HOST: zabbix-postgresql
      DB_SERVER_PORT: ${ZABBIX_DATABASE_PORT:-5432}
      POSTGRES_USER: ${ZABBIX_DATABASE_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DATABASE_PASSWORD:?ZABBIX_DATABASE_PASSWORD is required}
      POSTGRES_DB: ${ZABBIX_DATABASE_NAME:-zabbix}
      PHP_TZ: UTC
      ZBX_SERVER_NAME: ObserveWeaver Zabbix
    ports:
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${ZABBIX_WEB_PORT:-8080}:8080"
    networks:
      - frontend
      - backend
    depends_on:
      zabbix-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    profiles: [redis]
    <<: *default-restart
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        exec redis-server --bind 0.0.0.0 --port "$${REDIS_PORT:-6379}"
        --appendonly yes --appendfsync everysec --protected-mode yes
        --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_PORT: ${REDIS_PORT:-6379}
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test \"$$(redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping)\" = PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  kafka:
    image: ${KAFKA_IMAGE:?KAFKA_IMAGE is required}
    hostname: kafka
    profiles: [kafka]
    <<: *default-restart
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is required}
      KAFKA_NODE_ID: 1
      KAFKA_PORT: ${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_PORT: ${KAFKA_CONTROLLER_PORT:-9095}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:${KAFKA_PORT:-9092},CONTROLLER://:${KAFKA_CONTROLLER_PORT:-9095}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:${KAFKA_CONTROLLER_PORT:-9095}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${KAFKA_PORT:-9092}:${KAFKA_PORT:-9092}"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if command -v kafka-broker-api-versions >/dev/null 2>&1; then
          kafka-broker-api-versions --bootstrap-server 127.0.0.1:${KAFKA_PORT:-9092};
          elif command -v kafka-broker-api-versions.sh >/dev/null 2>&1; then
          kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:${KAFKA_PORT:-9092};
          elif [ -x /opt/kafka/bin/kafka-broker-api-versions.sh ]; then
          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server
          127.0.0.1:${KAFKA_PORT:-9092}; else exit 1; fi >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  mongodb:
    image: ${MONGODB_IMAGE:?MONGODB_IMAGE is required}
    profiles: [mongodb]
    <<: *default-restart
    command: ["mongod", "--bind_ip_all", "--port", "${MONGODB_PORT:-27017}"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: graylog
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?MONGODB_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: graylog
    volumes:
      - mongodb-data:/data/db
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --port ${MONGODB_PORT:-27017} --username graylog --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  opensearch:
    image: ${OPENSEARCH_IMAGE:?OPENSEARCH_IMAGE is required}
    profiles: [opensearch]
    <<: *default-restart
    environment:
      cluster.name: observeweaver
      node.name: opensearch-standalone
      discovery.type: single-node
      http.port: ${OPENSEARCH_PORT:-9200}
      transport.port: ${OPENSEARCH_TRANSPORT_PORT:-9300}
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms2g -Xmx2g}
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:${OPENSEARCH_PORT:-9200}/_cluster/health?wait_for_status=yellow >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:?ELASTICSEARCH_IMAGE is required}
    profiles: [elasticsearch]
    <<: *default-restart
    environment:
      cluster.name: observeweaver-elastic
      node.name: elasticsearch-standalone
      discovery.type: single-node
      http.port: ${ELASTICSEARCH_PORT:-9201}
      transport.port: ${ELASTICSEARCH_TRANSPORT_PORT:-9301}
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${ELASTICSEARCH_PORT:-9201}:${ELASTICSEARCH_PORT:-9201}"
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent -u elastic:$${ELASTIC_PASSWORD} http://127.0.0.1:${ELASTICSEARCH_PORT:-9201}/_cluster/health?wait_for_status=yellow >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  elastic-bootstrap:
    image: ${ELASTICSEARCH_IMAGE:?ELASTICSEARCH_IMAGE is required}
    profiles: [elasticsearch]
    restart: "no"
    environment:
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:-9201}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-}
      LOGSTASH_WRITER_PASSWORD: ${LOGSTASH_WRITER_PASSWORD:-}
      KIBANA_ENABLED: ${KIBANA_ENABLED:-false}
      LOGSTASH_ENABLED: ${LOGSTASH_ENABLED:-false}
    command:
      - bash
      - -ec
      - |
        until curl --fail --silent --show-error \
          --user "elastic:$${ELASTIC_PASSWORD}" \
          "http://elasticsearch:$${ELASTICSEARCH_PORT:-9201}/_cluster/health?wait_for_status=yellow" \
          >/dev/null; do sleep 5; done
        if [ "$${KIBANA_ENABLED}" = "true" ]; then
          curl --fail --silent --show-error \
            --user "elastic:$${ELASTIC_PASSWORD}" \
            --header 'Content-Type: application/json' --request POST \
            "http://elasticsearch:$${ELASTICSEARCH_PORT:-9201}/_security/user/kibana_system/_password" \
            --data "{\"password\":\"$${KIBANA_SYSTEM_PASSWORD}\"}" >/dev/null
        fi
        if [ "$${LOGSTASH_ENABLED}" = "true" ]; then
          curl --fail --silent --show-error \
            --user "elastic:$${ELASTIC_PASSWORD}" \
            --header 'Content-Type: application/json' --request PUT \
            "http://elasticsearch:$${ELASTICSEARCH_PORT:-9201}/_security/role/logstash_writer" \
            --data '{"cluster":["manage_index_templates","monitor","manage_ilm"],"indices":[{"names":["observeweaver-logs-*"],"privileges":["write","create","delete","create_index","manage","manage_ilm"]}]}' >/dev/null
          curl --fail --silent --show-error \
            --user "elastic:$${ELASTIC_PASSWORD}" \
            --header 'Content-Type: application/json' --request PUT \
            "http://elasticsearch:$${ELASTICSEARCH_PORT:-9201}/_security/user/logstash_internal" \
            --data "{\"password\":\"$${LOGSTASH_WRITER_PASSWORD}\",\"roles\":[\"logstash_writer\"],\"full_name\":\"ObserveWeaver Logstash writer\"}" >/dev/null
        fi
    networks:
      - backend
    depends_on:
      elasticsearch:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  kibana:
    image: ${KIBANA_IMAGE:?KIBANA_IMAGE is required}
    profiles: [kibana]
    <<: *default-restart
    environment:
      SERVER_NAME: kibana
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: ${KIBANA_PORT:-5601}
      SERVER_PUBLICBASEURL: ${OBSERVEWEAVER_SCHEME:-https}://kibana.${OBSERVEWEAVER_DOMAIN:?OBSERVEWEAVER_DOMAIN is required}/
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:${ELASTICSEARCH_PORT:-9201}"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?KIBANA_SYSTEM_PASSWORD is required}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_ENCRYPTION_KEY:?KIBANA_SECURITY_ENCRYPTION_KEY is required}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?KIBANA_ENCRYPTION_KEY is required}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_ENCRYPTION_KEY:?KIBANA_REPORTING_ENCRYPTION_KEY is required}
    ports:
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${KIBANA_PORT:-5601}:${KIBANA_PORT:-5601}"
    networks:
      - frontend
      - backend
    depends_on:
      elastic-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:${KIBANA_PORT:-5601}/api/status >/dev/null || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  logstash:
    image: ${LOGSTASH_IMAGE:?LOGSTASH_IMAGE is required}
    profiles: [logstash]
    <<: *default-restart
    environment:
      LS_JAVA_OPTS: ${LOGSTASH_JAVA_OPTS:--Xms1g -Xmx1g}
      QUEUE_TYPE: persisted
      ELASTICSEARCH_HOSTS: http://elasticsearch:${ELASTICSEARCH_PORT:-9201}
      ELASTICSEARCH_USERNAME: logstash_internal
      LOGSTASH_WRITER_PASSWORD: ${LOGSTASH_WRITER_PASSWORD:?LOGSTASH_WRITER_PASSWORD is required}
    volumes:
      - "${DOCKER_CONFIG_DIR:?DOCKER_CONFIG_DIR is required}/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro"
      - logstash-data:/usr/share/logstash/data
    ports:
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${LOGSTASH_BEATS_PORT:-5045}:${LOGSTASH_BEATS_PORT:-5045}"
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${LOGSTASH_API_PORT:-9600}:${LOGSTASH_API_PORT:-9600}"
    networks:
      - frontend
      - backend
    depends_on:
      elastic-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:${LOGSTASH_API_PORT:-9600}/?pretty >/dev/null || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  graylog:
    image: ${GRAYLOG_IMAGE:?GRAYLOG_IMAGE is required}
    profiles: [graylog]
    <<: *default-restart
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET:?GRAYLOG_PASSWORD_SECRET is required}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2:?GRAYLOG_ROOT_PASSWORD_SHA2 is required}
      GRAYLOG_MONGODB_URI: mongodb://graylog:${MONGODB_ROOT_PASSWORD:?MONGODB_ROOT_PASSWORD is required}@mongodb:${MONGODB_PORT:-27017}/graylog?authSource=admin
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch:${OPENSEARCH_PORT:-9200}
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:${GRAYLOG_HTTP_PORT:-9000}
      GRAYLOG_HTTP_EXTERNAL_URI: ${OBSERVEWEAVER_SCHEME:-https}://graylog.${OBSERVEWEAVER_DOMAIN:?OBSERVEWEAVER_DOMAIN is required}/
      GRAYLOG_HTTP_PUBLISH_URI: http://graylog:${GRAYLOG_HTTP_PORT:-9000}/
      GRAYLOG_MESSAGE_JOURNAL_MAX_AGE: ${GRAYLOG_RETENTION_DAYS:-30}d
      GRAYLOG_ELASTICSEARCH_REPLICAS: ${GRAYLOG_ELASTICSEARCH_REPLICAS:-0}
      GRAYLOG_ROTATION_STRATEGY: time
      GRAYLOG_ELASTICSEARCH_MAX_TIME_PER_INDEX: 1d
      GRAYLOG_RETENTION_STRATEGY: delete
      GRAYLOG_ELASTICSEARCH_MAX_NUMBER_OF_INDICES: ${GRAYLOG_RETENTION_DAYS:-30}
    entrypoint: /usr/bin/tini -- wait-for-it opensearch:${OPENSEARCH_PORT:-9200} -- /docker-entrypoint.sh
    volumes:
      - graylog-journal:/usr/share/graylog/data/journal
    ports:
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${GRAYLOG_HTTP_PORT:-9000}:${GRAYLOG_HTTP_PORT:-9000}"
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${GRAYLOG_GELF_TCP_PORT:-12201}:${GRAYLOG_GELF_TCP_PORT:-12201}/tcp"
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${GRAYLOG_GELF_UDP_PORT:-12201}:${GRAYLOG_GELF_UDP_PORT:-12201}/udp"
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${GRAYLOG_SYSLOG_TCP_PORT:-1514}:${GRAYLOG_SYSLOG_TCP_PORT:-1514}/tcp"
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${GRAYLOG_SYSLOG_UDP_PORT:-1514}:${GRAYLOG_SYSLOG_UDP_PORT:-1514}/udp"
      - "${OBSERVEWEAVER_ENDPOINT_ADDRESS:-127.0.0.1}:${GRAYLOG_BEATS_PORT:-5044}:${GRAYLOG_BEATS_PORT:-5044}/tcp"
    networks:
      - frontend
      - backend
    depends_on:
      mongodb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:${GRAYLOG_HTTP_PORT:-9000}/api/system/lbstatus >/dev/null || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  postgresql:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    profiles: ["ha-metadata"]
    <<: *default-restart
    environment:
      POSTGRES_DB: grafana
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d grafana"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  frontend:
  backend:
    internal: true

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  mongodb-data:
  opensearch-data:
  elasticsearch-data:
  logstash-data:
  graylog-journal:
  postgresql-data:
  zabbix-postgresql-data:
  redis-data:
  kafka-data:
