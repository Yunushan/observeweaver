---
- name: Set Alertmanager artifact facts
  ansible.builtin.set_fact:
    observeweaver_alertmanager_version: "{{ observeweaver.components.alertmanager.version }}"
    observeweaver_alertmanager_arch: "{{ observeweaver_download_arch[ansible_architecture] }}"

- name: Create Alertmanager service account
  ansible.builtin.user:
    name: alertmanager
    system: true
    shell: /usr/sbin/nologin
    home: "{{ observeweaver_data_root }}/alertmanager"
    create_home: false

- name: Download Alertmanager
  ansible.builtin.get_url:
    url: >-
      {{
        'https://github.com/prometheus/alertmanager/releases/download/v' ~
        observeweaver_alertmanager_version ~ '/alertmanager-' ~
        observeweaver_alertmanager_version ~ '.linux-' ~
        observeweaver_alertmanager_arch ~ '.tar.gz'
      }}
    dest: >-
      {{ observeweaver_cache_root }}/alertmanager-{{
      observeweaver_alertmanager_version }}.tar.gz
    checksum: "sha256:{{ observeweaver_alertmanager_linux_amd64_sha256 }}"
    mode: "0644"

- name: Extract Alertmanager
  ansible.builtin.unarchive:
    src: >-
      {{ observeweaver_cache_root }}/alertmanager-{{
      observeweaver_alertmanager_version }}.tar.gz
    dest: "{{ observeweaver_install_root }}"
    remote_src: true
    creates: >-
      {{ observeweaver_install_root }}/alertmanager-{{
      observeweaver_alertmanager_version }}.linux-{{
      observeweaver_alertmanager_arch }}/alertmanager

- name: Link Alertmanager binaries
  ansible.builtin.file:
    src: >-
      {{ observeweaver_install_root }}/alertmanager-{{
      observeweaver_alertmanager_version }}.linux-{{
      observeweaver_alertmanager_arch }}/{{ item }}
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - alertmanager
    - amtool
  notify: Restart alertmanager

- name: Create Alertmanager directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: alertmanager
    group: alertmanager
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ observeweaver_config_root }}/alertmanager"
      mode: "0750"
    - path: "{{ observeweaver_data_root }}/alertmanager"
      mode: "0750"

- name: Configure Alertmanager
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ observeweaver_config_root }}/alertmanager/alertmanager.yml"
    owner: alertmanager
    group: alertmanager
    mode: "0640"
    validate: "/usr/local/bin/amtool check-config %s"
  notify: Restart alertmanager

- name: Install Alertmanager systemd unit
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart alertmanager

- name: Enable Alertmanager
  ansible.builtin.systemd_service:
    name: alertmanager
    enabled: true
    state: started
    daemon_reload: true
