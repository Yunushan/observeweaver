---
- name: Install Elastic repository key for Kibana on Debian family
  ansible.builtin.get_url:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    dest: /usr/share/keyrings/elastic.gpg
    owner: root
    group: root
    mode: "0644"
  when: ansible_os_family == 'Debian'

- name: Configure Elastic repository for Kibana on Debian family
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/elastic.gpg]
      https://artifacts.elastic.co/packages/9.x/apt stable main
    filename: elastic-9.x
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Configure Elastic repository for Kibana on Red Hat family
  ansible.builtin.yum_repository:
    name: elastic-9.x
    description: Elastic 9.x packages
    baseurl: https://artifacts.elastic.co/packages/9.x/yum
    enabled: true
    gpgcheck: true
    gpgkey: https://artifacts.elastic.co/GPG-KEY-elasticsearch
  when: ansible_os_family == 'RedHat'

- name: Install pinned Kibana package
  ansible.builtin.package:
    name: >-
      {{ 'kibana=' ~ observeweaver.components.kibana.version
      if ansible_os_family == 'Debian'
      else 'kibana-' ~ observeweaver.components.kibana.version }}
    state: present

- name: Install Elasticsearch CA for Kibana on a data node
  ansible.builtin.copy:
    src: /etc/elasticsearch/observeweaver-root-ca.pem
    dest: /etc/kibana/observeweaver-root-ca.pem
    remote_src: true
    owner: root
    group: kibana
    mode: "0644"
  when: inventory_hostname in groups.get('elasticsearch', [])
  notify: Restart kibana

- name: Fetch Elasticsearch CA for a separate Kibana host
  ansible.builtin.slurp:
    src: /etc/elasticsearch/observeweaver-root-ca.pem
  register: observeweaver_kibana_ca_source
  delegate_to: "{{ groups['elasticsearch'] | first }}"
  when: inventory_hostname not in groups.get('elasticsearch', [])

- name: Install Elasticsearch CA on Kibana host
  ansible.builtin.copy:
    dest: /etc/kibana/observeweaver-root-ca.pem
    owner: root
    group: kibana
    mode: "0644"
    content: "{{ observeweaver_kibana_ca_source.content | b64decode }}"
  when: inventory_hostname not in groups.get('elasticsearch', [])
  notify: Restart kibana

- name: Configure Kibana
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: /etc/kibana/kibana.yml
    owner: root
    group: kibana
    mode: "0640"
  notify: Restart kibana

- name: Enable Kibana
  ansible.builtin.systemd_service:
    name: kibana
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for Kibana API
  ansible.builtin.wait_for:
    host: "{{ hostvars[inventory_hostname].ansible_host }}"
    port: "{{ observeweaver.network.ports.kibana }}"
    timeout: 180
