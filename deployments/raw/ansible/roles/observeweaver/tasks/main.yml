---
- name: Include common host preparation
  ansible.builtin.import_tasks: common.yml

- name: Install Prometheus
  ansible.builtin.include_tasks: prometheus.yml
  when:
    - observeweaver.components.prometheus.enabled | bool
    - inventory_hostname in groups.get('prometheus', [])

- name: Install Alertmanager
  ansible.builtin.include_tasks: alertmanager.yml
  when:
    - observeweaver.components.alertmanager.enabled | bool
    - inventory_hostname in groups.get('alertmanager', [])

- name: Install Grafana
  ansible.builtin.include_tasks: grafana.yml
  when:
    - observeweaver.components.grafana.enabled | bool
    - inventory_hostname in groups.get('grafana', [])

- name: Install OpenTelemetry Collector
  ansible.builtin.include_tasks: otel.yml
  when:
    - observeweaver.components.opentelemetry.enabled | bool
    - inventory_hostname in groups.get('opentelemetry', [])

- name: Install Zabbix Server and web frontend
  ansible.builtin.include_tasks: zabbix.yml
  vars:
    zabbix_database_host: >-
      {{ lookup('ansible.builtin.ini', 'ZABBIX_DATABASE_HOST', type='properties',
      file=observeweaver_secret_file) }}
    zabbix_database_port: >-
      {{ lookup('ansible.builtin.ini', 'ZABBIX_DATABASE_PORT', type='properties',
      file=observeweaver_secret_file) | default('5432', true) }}
    zabbix_database_user: >-
      {{ lookup('ansible.builtin.ini', 'ZABBIX_DATABASE_USER', type='properties',
      file=observeweaver_secret_file) | default('zabbix', true) }}
    zabbix_database_password: >-
      {{ lookup('ansible.builtin.ini', 'ZABBIX_DATABASE_PASSWORD', type='properties',
      file=observeweaver_secret_file) }}
    zabbix_database_name: >-
      {{ lookup('ansible.builtin.ini', 'ZABBIX_DATABASE_NAME', type='properties',
      file=observeweaver_secret_file) | default('zabbix', true) }}
  when:
    - observeweaver.components.zabbix.enabled | bool
    - inventory_hostname in groups.get('zabbix', [])

- name: Install MongoDB
  ansible.builtin.include_tasks: mongodb.yml
  when:
    - observeweaver.components.graylog.enabled | bool
    - not (observeweaver.dependencies.mongodb.external | bool)
    - inventory_hostname in groups.get('mongodb', [])

- name: Install Redis and Redis Sentinel
  ansible.builtin.include_tasks: redis.yml
  vars:
    redis_password: >-
      {{ lookup('ansible.builtin.ini', 'REDIS_PASSWORD', type='properties',
      file=observeweaver_secret_file) }}
  when:
    - observeweaver.components.redis.enabled | bool
    - inventory_hostname in groups.get('redis', [])

- name: Install Kafka in KRaft mode
  ansible.builtin.include_tasks: kafka.yml
  when:
    - observeweaver.components.kafka.enabled | bool
    - inventory_hostname in groups.get('kafka', [])

- name: Install OpenSearch
  ansible.builtin.include_tasks: opensearch.yml
  when:
    - observeweaver.components.opensearch.enabled | bool
    - inventory_hostname in groups.get('opensearch', [])

- name: Install Elasticsearch
  ansible.builtin.include_tasks: elasticsearch.yml
  vars:
    observeweaver_elasticsearch_password: >-
      {{ lookup('ansible.builtin.ini', 'ELASTICSEARCH_PASSWORD', type='properties',
      file=observeweaver_secret_file) }}
    observeweaver_kibana_system_password: >-
      {{ lookup('ansible.builtin.ini', 'KIBANA_SYSTEM_PASSWORD', type='properties',
      file=observeweaver_secret_file) }}
    observeweaver_logstash_writer_password: >-
      {{ lookup('ansible.builtin.ini', 'LOGSTASH_WRITER_PASSWORD', type='properties',
      file=observeweaver_secret_file) }}
  when:
    - observeweaver.components.elasticsearch.enabled | bool
    - inventory_hostname in groups.get('elasticsearch', [])

- name: Install Kibana
  ansible.builtin.include_tasks: kibana.yml
  vars:
    observeweaver_elasticsearch_password: >-
      {{ lookup('ansible.builtin.ini', 'ELASTICSEARCH_PASSWORD', type='properties',
      file=observeweaver_secret_file) }}
    observeweaver_kibana_system_password: >-
      {{ lookup('ansible.builtin.ini', 'KIBANA_SYSTEM_PASSWORD', type='properties',
      file=observeweaver_secret_file) }}
    observeweaver_kibana_encryption_key: >-
      {{ lookup('ansible.builtin.ini', 'KIBANA_ENCRYPTION_KEY', type='properties',
      file=observeweaver_secret_file) }}
    observeweaver_kibana_reporting_key: >-
      {{ lookup('ansible.builtin.ini', 'KIBANA_REPORTING_ENCRYPTION_KEY', type='properties',
      file=observeweaver_secret_file) }}
    observeweaver_kibana_security_key: >-
      {{ lookup('ansible.builtin.ini', 'KIBANA_SECURITY_ENCRYPTION_KEY', type='properties',
      file=observeweaver_secret_file) }}
  when:
    - observeweaver.components.kibana.enabled | bool
    - inventory_hostname in groups.get('kibana', [])

- name: Install Logstash
  ansible.builtin.include_tasks: logstash.yml
  vars:
    observeweaver_elasticsearch_password: >-
      {{ lookup('ansible.builtin.ini', 'ELASTICSEARCH_PASSWORD', type='properties',
      file=observeweaver_secret_file) }}
    observeweaver_logstash_writer_password: >-
      {{ lookup('ansible.builtin.ini', 'LOGSTASH_WRITER_PASSWORD', type='properties',
      file=observeweaver_secret_file) }}
  when:
    - observeweaver.components.logstash.enabled | bool
    - inventory_hostname in groups.get('logstash', [])
