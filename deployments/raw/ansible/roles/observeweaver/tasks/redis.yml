---
- name: Install Redis build dependencies on Debian family
  ansible.builtin.apt:
    name: [build-essential, tcl, pkg-config]
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Install Redis build dependencies on Red Hat family
  ansible.builtin.dnf:
    name: [gcc, make, tcl, pkgconf-pkg-config]
    state: present
  when: ansible_os_family == 'RedHat'

- name: Define immutable Redis installation paths
  ansible.builtin.set_fact:
    observeweaver_redis_archive: "{{ observeweaver_cache_root }}/redis-{{ observeweaver.components.redis.version }}.tar.gz"
    observeweaver_redis_source_dir: "{{ observeweaver_cache_root }}/redis-{{ observeweaver.components.redis.version }}"
    observeweaver_redis_install_dir: "{{ observeweaver_install_root }}/redis-{{ observeweaver.components.redis.version }}"

- name: Download the pinned Redis source archive
  ansible.builtin.get_url:
    url: "{{ observeweaver_redis_source_url }}"
    dest: "{{ observeweaver_redis_archive }}"
    checksum: "sha256:{{ observeweaver_redis_source_sha256 }}"
    mode: '0644'

- name: Extract the pinned Redis source archive
  ansible.builtin.unarchive:
    src: "{{ observeweaver_redis_archive }}"
    dest: "{{ observeweaver_cache_root }}"
    remote_src: true
    creates: "{{ observeweaver_redis_source_dir }}/src/redis-server"

- name: Compile the pinned Redis server
  ansible.builtin.command:
    argv: [make, '-C', "{{ observeweaver_redis_source_dir }}", 'BUILD_TLS=no', 'MALLOC=libc']
    creates: "{{ observeweaver_redis_source_dir }}/src/redis-server"

- name: Install the pinned Redis server
  ansible.builtin.command:
    argv: [make, '-C', "{{ observeweaver_redis_source_dir }}", "PREFIX={{ observeweaver_redis_install_dir }}", install]
    creates: "{{ observeweaver_redis_install_dir }}/bin/redis-server"

- name: Create the Redis system user
  ansible.builtin.user:
    name: redis
    system: true
    shell: /usr/sbin/nologin
    home: "{{ observeweaver_data_root }}/redis"
    create_home: false

- name: Create Redis runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: redis
    group: redis
    mode: '0750'
  loop:
    - "{{ observeweaver_data_root }}/redis"
    - "{{ observeweaver_config_root }}/redis"

- name: Enable Redis memory-overcommit setting
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: '1'
    state: present
    sysctl_set: true
    reload: true

- name: Render Redis server configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ observeweaver_config_root }}/redis/redis.conf"
    owner: redis
    group: redis
    mode: '0600'
  notify: Restart redis

- name: Install Redis systemd service
  ansible.builtin.template:
    src: redis.service.j2
    dest: /etc/systemd/system/redis.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart redis

- name: Enable Redis server
  ansible.builtin.systemd_service:
    name: redis
    enabled: true
    state: started
    daemon_reload: true

- name: Render Redis Sentinel configuration for cluster mode
  ansible.builtin.template:
    src: redis-sentinel.conf.j2
    dest: "{{ observeweaver_config_root }}/redis/sentinel.conf"
    owner: redis
    group: redis
    mode: '0600'
  when: observeweaver.deployment.mode == 'cluster'
  notify: Restart redis sentinel

- name: Install Redis Sentinel systemd service for cluster mode
  ansible.builtin.template:
    src: redis-sentinel.service.j2
    dest: /etc/systemd/system/redis-sentinel.service
    owner: root
    group: root
    mode: '0644'
  when: observeweaver.deployment.mode == 'cluster'
  notify:
    - Reload systemd
    - Restart redis sentinel

- name: Enable Redis Sentinel for cluster mode
  ansible.builtin.systemd_service:
    name: redis-sentinel
    enabled: true
    state: started
    daemon_reload: true
  when: observeweaver.deployment.mode == 'cluster'
