---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted

- name: Restart alertmanager
  ansible.builtin.systemd_service:
    name: alertmanager
    state: restarted

- name: Restart grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted

- name: Restart zabbix-server
  ansible.builtin.systemd_service:
    name: zabbix-server
    state: restarted

- name: Restart zabbix-php-fpm
  ansible.builtin.systemd_service:
    name: "{{ observeweaver_zabbix_php_fpm_service }}"
    state: restarted

- name: Restart otel
  ansible.builtin.systemd_service:
    name: otelcol-contrib
    state: restarted

- name: Restart mongodb
  ansible.builtin.systemd_service:
    name: mongod
    state: restarted

- name: Restart redis
  ansible.builtin.systemd_service:
    name: redis
    state: restarted

- name: Restart redis sentinel
  ansible.builtin.systemd_service:
    name: redis-sentinel
    state: restarted

- name: Restart opensearch
  ansible.builtin.systemd_service:
    name: opensearch
    state: restarted

- name: Restart graylog
  ansible.builtin.systemd_service:
    name: graylog-server
    state: restarted
